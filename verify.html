<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Подтверждение почты — AI Sana</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f7f6f2;color:#242320;font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{max-width:500px;padding:30px;background:#fffefc;border:1px solid #eae8e2;border-radius:18px;text-align:center;box-shadow:0 18px 50px #211e3510}h1{font-size:26px}.msg{color:#77766f}.good{color:#277454}.bad{color:#994337}.btn{display:inline-block;margin-top:12px;padding:11px 16px;border:0;border-radius:10px;background:#6855e8;color:white;text-decoration:none;font-weight:700;cursor:pointer}</style></head><body><main class="card"><div style="width:52px;height:52px;margin:0 auto 10px;border-radius:15px;background:#6855e8;color:#fff;display:grid;place-items:center;font-size:29px">✳</div><h1>Подтвердить почту</h1><p id="message" class="msg">Нажмите кнопку, чтобы подтвердить адрес.</p><button id="confirm" class="btn">Подтвердить почту</button><a id="login" class="btn" href="/login" hidden>Перейти ко входу</a></main><script>const msg=document.getElementById('message'),confirmButton=document.getElementById('confirm'),login=document.getElementById('login'),token=new URLSearchParams(location.search).get('token');confirmButton.onclick=async()=>{confirmButton.disabled=true;try{if(!token)throw Error('В ссылке нет токена подтверждения.');const res=await fetch('/api/auth/verify-email',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token})});const data=await res.json();if(!res.ok)throw Error(data.detail||'Не удалось подтвердить почту.');msg.textContent=data.message;msg.classList.add('good');confirmButton.hidden=true;login.hidden=false}catch(e){msg.textContent=e.message;msg.classList.add('bad');confirmButton.disabled=false}};</script></body></html>
